version: "3.8"
services:
  mssql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: mssql
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      SA_PASSWORD: "${APP_SECRET:?APP_SECRET must be set}"
      MSSQL_PID: "Developer"
    ports:
      - 1433:1433
    expose:
      - 1433
    volumes:
      - ./data:/var/opt/mssql/data
