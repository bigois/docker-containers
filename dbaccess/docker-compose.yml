version: '3.9'
services:
    dbaccess:
        build:
            dockerfile: ./Dockerfile
            context: .
            args:
                APP_SECRET: "${APP_SECRET:?APP_SECRET must be set}"
        image: ${DBACCESS_IMAGE_NAME}
        container_name: ${DBACCESS_CONTAINER_NAME}
        restart: always
        ports:
            - "${DBACCESS_LOCAL_PORT}:${DBACCESS_CONTAINER_PORT}"
